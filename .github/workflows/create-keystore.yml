name: Create Keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore release.jks -alias neon -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Neon Assault, OU=Game, O=Neon Assault, C=IR"
          base64 -w0 release.jks > keystore_base64.txt
          printf "KEYSTORE_PASSWORD=%s\nKEY_ALIAS=neon\nKEY_PASSWORD=%s\n" "$PASS" "$PASS" > secrets_info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-PRIVATE
          path: |
            release.jks
            keystore_base64.txt
            secrets_info.txt
          path: |
            release.jks
            keystore_base64.txt
            secrets_info.txt
